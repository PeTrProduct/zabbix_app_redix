      items:
        - uuid: d01ff0d581814238af2a85fcacd16b3d
          name: 'RAIDIX: API availability status'
          type: SCRIPT
          key: raidix.api.available
          delay: 5m
          history: 7d
          trends: '0'
          params: |
            try {
              var params = JSON.parse(value);
              var req = new HttpRequest();
              
              var auth = {
                "login": params.user,
                "password": params.password,
                "language": "en"
              }
              
              resp = req.post(encodeURI(params.url + '/api/auth'), JSON.stringify(auth));
              if (req.getStatus() != 200) {
                throw 'Response code: '+req.getStatus();
              }
              
              req.get(encodeURI(params.url + '/api/system'));           
            } catch (error) {
                Zabbix.log(3, "RAIDIX /api/system failed: " + params.url + " Error: " + error);
                if (!Number.isInteger(error))
                    return 520;
            }
            return req.getStatus();
          description: 'Get API service status.'
          valuemap:
            name: 'HTTP response status code'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          timeout: 10s
          parameters:
            - name: url
              value: '{$RAIDIX.URL.HOST}'
            - name: password
              value: '{$RAIDIX.AUTH.PASSWORD}'
            - name: user
              value: '{$RAIDIX.AUTH.USER}'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: ffd351bfe1a84457851e5bbf77fbc3f0
              expression: 'last(/RAIDIX by HTTP/raidix.api.available) <> 200'
              name: 'RAIDIX: API service not available'
              opdata: 'Current value: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The API service is not available. Check your network and authorization settings.'
              tags:
                - tag: scope
                  value: availability
